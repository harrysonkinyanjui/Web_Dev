<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebDev Registration System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="brand">
            <span class="logo">&lt;/&gt;</span>
            <h1>WebDev</h1>
        </div>

        <button type="button" id="theme" class="theme-btn">
            🌙 Dark Mode
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- REGISTRATION FORM -->
        <section class="card">
            <h2>Register a New Member</h2>

            <p class="subtitle">
                Join the WebDev club community.
            </p>

            <form id="regform" novalidate>

                <div class="grid-2">

                    <!-- FULL NAME -->
                    <div class="field">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="e.g. harrison kinyanjui"
                        >

                        <small class="error" id="nameError"></small>
                    </div>

                    <!-- EMAIL -->
                    <div class="field">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="e.g. kinyanjuistudent@example.com"
                        >

                        <small class="error" id="emailError"></small>
                    </div>

                    <!-- PASSWORD -->
                    <div class="field">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                        >

                        <small class="error" id="passwordError"></small>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="field">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                        >

                        <small class="error" id="confirmError"></small>
                    </div>

                    <!-- GENDER -->
                    <div class="field">
                        <label for="gender">Gender</label>

                        <select id="gender" name="gender">
                            <option value="">-- Select Gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>

                        <small class="error" id="genderError"></small>
                    </div>

                    <!-- DATE OF BIRTH -->
                    <div class="field">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                        >

                        <small class="error" id="dobError"></small>
                    </div>

                    <!-- COUNTRY -->
                    <div class="field">
                        <label for="country">Country</label>

                        <select id="country" name="country">
                            <option value="">-- Select Country --</option>
                            <option value="kenya">Kenya</option>
                            <option value="uganda">Uganda</option>
                            <option value="tz">Tanzania</option>
                        </select>

                        <small class="error" id="countryError"></small>
                    </div>

                    <!-- PHONE NUMBER -->
                    <div class="field">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Select a country first"
                            autocomplete="tel"
                        >

                        <small class="error" id="phoneError"></small>
                    </div>

                </div>

                <!-- BIOGRAPHY -->
                <div class="field">
                    <label for="bio">Short Biography</label>

                    <textarea
                        id="bio"
                        name="bio"
                        rows="4"
                        placeholder="Tell us about yourself..."
                    ></textarea>

                    <small class="error" id="bioError"></small>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="submit-btn">
                    Register
                </button>

                <!-- SUCCESS MESSAGE -->
                <p
                    id="successMsg"
                    class="success hidden"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>
        </section>

        <!-- REGISTERED MEMBERS -->
        <section class="card">
            <h2>
                Registered Members
                (<span id="count">0</span>)
            </h2>

            <p class="subtitle">
                New registrations appear here.
            </p>

            <ul id="memberList" class="member-list">
                <li class="empty" id="emptyNote">
                    No members yet. Register someone to begin.
                </li>
            </ul>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>
            &copy; 2026 WebDev: SPI 2201 Web Application Development,
            Kirinyaga University.
        </p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
